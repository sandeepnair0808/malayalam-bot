name: Daily Malayalam reel

on:
  schedule:
    # 13:07 UTC = 18:37 IST, an evening slot for Kerala audiences
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "queue = next ready-made reel from queue/ (no API keys needed); new = write a new story with Claude"
        type: choice
        options: [queue, new]
        default: queue
      theme:
        description: "Story idea (English) for source=new. Leave empty to pick an unused one."
        required: false
      story_file:
        description: "Use a ready story instead of writing one, e.g. examples/umbrella_story.json"
        required: false
      style:
        description: "Visual style for this run"
        type: choice
        options: [default, cartoon, 3d]
        default: default
      publish:
        description: "Publish to Instagram"
        type: boolean
        default: false

permissions:
  contents: write   # to commit data/history.json

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REELBOT_STYLE: ${{ (inputs.style && inputs.style != 'default' && inputs.style) || vars.REELBOT_STYLE || 'cartoon' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
      REELBOT_TTS: ${{ vars.REELBOT_TTS || 'edge' }}
      REELBOT_VOICE: ${{ vars.REELBOT_VOICE || 'ml-IN-MidhunNeural' }}
      # Scheduled runs publish only when the repo variable AUTO_PUBLISH is "true".
      SHOULD_PUBLISH: ${{ (github.event_name == 'schedule' && vars.AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (ffmpeg, cairo, Malayalam font)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2 fonts-smc-manjari

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev,realistic]'

      - name: Tests
        run: pytest -q

      - name: Make reel
        id: make
        env:
          THEME: ${{ inputs.theme }}
          STORY_FILE: ${{ inputs.story_file }}
          SOURCE: ${{ inputs.source || 'queue' }}
        run: |
          if [ "$SOURCE" = "queue" ] && [ -z "$STORY_FILE" ]; then
            dir=$(reelbot next | tail -n1)
            if [ "$dir" != "queue is empty" ]; then
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              cat "$dir/caption.txt"
              exit 0
            fi
            echo "Queue is empty; writing a new story with Claude."
          fi
          args=()
          if [ -n "$STORY_FILE" ]; then args=(--story "$STORY_FILE");
          elif [ -n "$THEME" ]; then args=(--theme "$THEME"); fi
          dir=$(reelbot make "${args[@]}" | tail -n1)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          cat "$dir/caption.txt"

      - name: Upload reel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            ${{ steps.make.outputs.dir }}/reel.mp4
            ${{ steps.make.outputs.dir }}/story.json
            ${{ steps.make.outputs.dir }}/caption.txt
            ${{ steps.make.outputs.dir }}/scenes/*.png
            ${{ steps.make.outputs.dir }}/characters/*.png
          retention-days: 14

      - name: Phone-friendly preview (GitHub release with the MP4)
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.make.outputs.dir }}
        run: |
          tag="reel-${{ github.run_id }}"
          gh release create "$tag" "$DIR/reel.mp4" --prerelease \
            --title "Reel preview: $(basename "$DIR") ($REELBOT_STYLE)" \
            --notes-file "$DIR/caption.txt"
          echo "Preview: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Instagram
        if: env.SHOULD_PUBLISH == 'true'
        run: reelbot publish "${{ steps.make.outputs.dir }}"

      - name: Commit history
        if: always() && steps.make.outcome == 'success'
        run: |
          git config user.name "reelbot"
          git config user.email "reelbot@users.noreply.github.com"
          if [ -f data/history.json ]; then git add data/history.json; fi
          git add queue/*/published.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "reel: ${{ steps.make.outputs.dir }}"
          git push
